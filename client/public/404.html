<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Halaman tidak ditemukan | Tetra Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;800&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: #fafaf8;
        color: #1f1f1f;
        font-family: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
      }
      main { width: 100%; max-width: 40rem; }
      svg { width: 3.5rem; height: auto; color: #1e3a5f; }
      p.code { margin: 2.5rem 0 0; font-weight: 500; color: #595959; border-top: 1px solid #b8975a; padding-top: 1rem; }
      h1 { margin: 1rem 0 0; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 0.95; letter-spacing: -0.03em; font-weight: 500; font-family: "Newsreader", Georgia, serif; color: #1e3a5f; }
      h1 span { color: #b8975a; }
      p.body { font-size: 1.125rem; line-height: 1.6; max-width: 32rem; }
      a.btn {
        display: inline-flex; align-items: center; min-height: 44px; margin-top: 1.5rem;
        padding: 0.75rem 1.25rem; border-radius: 6px; background: #1e3a5f; color: #fafaf8;
        font-weight: 800; text-decoration: none;
      }
      a.btn:hover { background: #1f1f1f; }
      a:focus-visible { outline: 3px solid #1e3a5f; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 100 88" aria-hidden="true">
        <mask id="m">
          <path d="M50 0 100 88H0Z" fill="#fff" />
          <path d="M52 3 50 48M21 50 42 63M58 60 80 54M44 68 33 88M60 67 76 88" stroke="#000" stroke-width="3.5" />
          <path d="M50 45 63 69H37Z" fill="#000" />
        </mask>
        <path d="M50 0 100 88H0Z" fill="currentColor" mask="url(#m)" />
        <path d="M50 51 58.5 66h-17Z" fill="#b8975a" />
      </svg>
      <p class="code">404</p>
      <h1>Halaman ini belum kami bangun<span>.</span></h1>
      <p class="body">Mungkin tautannya salah ketik, atau halamannya sudah pindah. Yuk, kembali ke beranda Tetra Studio.</p>
      <a class="btn" href="/">Kembali ke beranda</a>
    </main>
  </body>
</html>
